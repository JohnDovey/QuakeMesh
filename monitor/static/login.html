<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuakeMesh Monitor — Login</title>
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="qm-body">
  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
        <div class="card qm-panel auth-card mt-5">
          <div class="card-body p-4">
            <h1 class="h3 mb-2">QuakeMesh Monitor</h1>
            <p class="text-secondary">Sign in to administer the mesh network.</p>
            <div id="error" class="alert alert-danger hidden py-2" role="alert"></div>
            <form id="login-form">
              <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input class="form-control" id="username" name="username" value="Admin" autocomplete="username" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
              </div>
              <button type="submit" class="btn btn-success w-100">Sign in</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="/vendor/jquery/jquery.min.js"></script>
  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script>
    $(function () {
      $('#login-form').on('submit', async function (e) {
        e.preventDefault();
        const $err = $('#error');
        $err.addClass('hidden').text('');
        const body = {
          username: $('#username').val(),
          password: $('#password').val(),
        };
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          if (res.status === 429) {
            $err.text('Too many failed attempts. Wait 60 seconds and try again.').removeClass('hidden');
            return;
          }
          if (!res.ok) {
            $err.text('Invalid username or password.').removeClass('hidden');
            return;
          }
          const data = await res.json();
          window.location.href = data.must_change_password ? '/change-password' : '/';
        } catch (ex) {
          $err.text(ex.message).removeClass('hidden');
        }
      });
    });
  </script>
</body>
</html>
