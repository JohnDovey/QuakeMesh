<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuakeMesh Monitor — Change Password</title>
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="qm-body">
  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
        <div class="card qm-panel auth-card mt-5">
          <div class="card-body p-4">
            <h1 class="h3 mb-2">Change password</h1>
            <p class="text-secondary">The default password must be changed before you can use the dashboard.</p>
            <div id="error" class="alert alert-danger hidden py-2" role="alert"></div>
            <form id="change-form">
              <div class="mb-3">
                <label class="form-label" for="current">Current password</label>
                <input class="form-control" id="current" type="password" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="new">New password (min 8 characters)</label>
                <input class="form-control" id="new" type="password" minlength="8" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="confirm">Confirm new password</label>
                <input class="form-control" id="confirm" type="password" minlength="8" required>
              </div>
              <button type="submit" class="btn btn-success w-100">Save new password</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="/vendor/jquery/jquery.min.js"></script>
  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/js/common.js"></script>
  <script>
    $(function () {
      $('#change-form').on('submit', async function (e) {
        e.preventDefault();
        const $err = $('#error');
        $err.addClass('hidden').text('');
        const current = $('#current').val();
        const newPass = $('#new').val();
        const confirm = $('#confirm').val();
        if (newPass !== confirm) {
          $err.text('New passwords do not match.').removeClass('hidden');
          return;
        }
        try {
          await api('/api/change-password', {
            method: 'POST',
            body: JSON.stringify({ current_password: current, new_password: newPass }),
          });
          window.location.href = '/';
        } catch (ex) {
          $err.text(ex.message).removeClass('hidden');
        }
      });
    });
  </script>
</body>
</html>
