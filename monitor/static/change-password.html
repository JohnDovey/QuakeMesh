<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuakeMesh Monitor — Change Password</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main>
    <div class="panel auth-card">
      <h1>Change password</h1>
      <p>The default password must be changed before you can use the dashboard.</p>
      <div id="error" class="error hidden"></div>
      <form id="change-form">
        <label for="current">Current password</label>
        <input id="current" type="password" required>
        <label for="new">New password (min 8 characters)</label>
        <input id="new" type="password" minlength="8" required>
        <label for="confirm">Confirm new password</label>
        <input id="confirm" type="password" minlength="8" required>
        <button type="submit">Save new password</button>
      </form>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script>
    document.getElementById('change-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('error');
      err.classList.add('hidden');
      const current = document.getElementById('current').value;
      const newPass = document.getElementById('new').value;
      const confirm = document.getElementById('confirm').value;
      if (newPass !== confirm) {
        err.textContent = 'New passwords do not match.';
        err.classList.remove('hidden');
        return;
      }
      try {
        await api('/api/change-password', {
          method: 'POST',
          body: JSON.stringify({ current_password: current, new_password: newPass }),
        });
        window.location.href = '/';
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
