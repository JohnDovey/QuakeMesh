syntax = "proto3";

package quakemesh.wire;

option go_package = "github.com/JohnDovey/QuakeMesh/proto/wire;wire";
option java_package = "net.quakemesh.proto";

// Frame is the outermost envelope for every message sent over any transport.
// Intermediate repeater nodes read only this header; the payload is opaque
// ciphertext sealed to dst_node_id.
message Frame {
  bytes src_node_id = 1;
  bytes dst_node_id = 2;
  uint32 hop_count = 3;
  uint32 ttl = 4;
  repeated string transport_hints = 5;
  bytes payload = 6;
}
