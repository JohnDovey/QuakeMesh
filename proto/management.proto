syntax = "proto3";

package quakemesh.wire;

option go_package = "github.com/JohnDovey/QuakeMesh/proto/wire;wire";
option java_package = "net.quakemesh.proto";

// Emitted when an app publishes to the SOS topic via the mesh-sdk daemon.
message SosAlertPublished {
  bytes node_id = 1;
  string app_id = 2;
  string topic = 3;
  bytes payload_json = 4;
}

// Live event stream from a Hub's loopback management API (127.0.0.1:8083)
// to QuakeMeshMonitor, delivered over the Monitor's /ws WebSocket endpoint.
message ManagementEvent {
  int64 emitted_at_unix_ms = 1;

  oneof event {
    NodeStatusChanged node_status_changed = 2;
    RouteChanged route_changed = 3;
    DtnQueueDepthChanged dtn_queue_depth_changed = 4;
    HubStatusChanged hub_status_changed = 5;
    InternetFallbackChanged internet_fallback_changed = 6;
    AppPresenceChanged app_presence_changed = 7;
    BanProposalChanged ban_proposal_changed = 8;
    BanVerdictChanged ban_verdict_changed = 9;
    SosAlertPublished sos_alert_published = 10;
  }
}

message HubStatusChanged {
  bytes hub_id = 1;
  string status = 2;
}

message NodeStatusChanged {
  bytes node_id = 1;
  string status = 2;
}

message RouteChanged {
  bytes dst_node_id = 1;
  bytes next_hop_node_id = 2;
  double tq = 3;
  uint32 hop_count = 4;
}

message DtnQueueDepthChanged {
  uint32 depth = 1;
}

message InternetFallbackChanged {
  bool enabled = 1;
}

message AppPresenceChanged {
  bytes node_id = 1;
  string app_id = 2;
  string app_version = 3;
}

message BanProposalChanged {
  bytes ban_id = 1;
  string app_id = 2;
  string version_range = 3;
}

message BanVerdictChanged {
  bytes ban_id = 1;
  bytes hub_id = 2;
  bool agree = 3;
}
